<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f1fa">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ZEL">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{site}}/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ZEL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{site}}/assets/og-image.png">
  <link rel="preload" href="/assets/Aeonik-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/projects.css">
  <script type="application/ld+json">{{org-schema}}</script>
</head>
<body data-page="{{page}}">
  <div class="preloader" aria-hidden="true">
    <div class="pl-mark"><i class="pl-track"></i><i class="pl-fill"></i><i class="pl-top"></i><i class="pl-diag"></i><i class="pl-bottom"></i></div>
    <div class="pl-count"><span class="pl-digit"><span><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i></span></span><span class="pl-digit"><span><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i></span></span><span class="pl-digit"><span><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i></span></span></div>
  </div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="header">
    <a class="logo" href="/" aria-label="ZEL home">ZEL</a>
    <nav class="header-actions" aria-label="Main navigation">
      <button class="sound pill" aria-label="Enable sound" aria-pressed="false" title="Sound off"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14H25"/></svg></button>
      <button class="talk pill dark" data-contact><span class="talk-arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span><span class="talk-label">LET’S TALK</span><span class="talk-dot" aria-hidden="true"></span></button>
      <button class="menu-button pill" aria-expanded="false" aria-controls="menu-dialog"><span class="menu-button-label"><span>MENU</span><span aria-hidden="true">CLOSE</span></span><span class="menu-dots" aria-hidden="true"><i></i><i></i></span></button>
    </nav>
  </header>
  <main id="main" data-page-root>
{{main}}
  </main>
{{footer}}
  <div class="scroll-indicator" aria-hidden="true"><i></i></div>
  <canvas id="fluid-canvas" aria-hidden="true"></canvas>
  <dialog id="menu-dialog" class="menu-dialog"><div class="menu-inner"><span class="menu-label">EXPLORE ZEL</span><nav aria-label="Explore"><a href="/">Home <span>01</span></a><a href="/about/">About <span>02</span></a><a href="/projects/">Projects <span>03</span></a><a href="/contact/">Contact <span>04</span></a></nav><button class="menu-contact" data-contact>Let’s make something extraordinary. ↗</button><p class="menu-direct">{{contact-links}}</p></div></dialog>
  <dialog id="contact-dialog" class="contact-dialog"><button class="dialog-close pill" data-close aria-label="Close contact">CLOSE ×</button><span class="menu-label">LET’S TALK</span><h2>Your next<br>big idea.</h2><p>Three quick steps. Rather talk? Call <a href="{{phone-href}}">{{phone}}</a>.</p><form id="contact-form" data-brief-form data-step="1">{{brief-form}}</form></dialog>
  <dialog id="media-dialog" class="media-dialog"><button class="dialog-close pill" data-close aria-label="Close media"><span class="close-label">CLOSE </span>×</button><div class="media-dialog-content"></div></dialog>
  <dialog id="lightbox" class="lightbox" aria-label="Project screenshots"><div class="lightbox-bar"><span class="lightbox-count" aria-live="polite"></span><span class="lightbox-group"></span><button class="dialog-close pill" data-close aria-label="Close gallery">CLOSE ×</button></div><div class="lightbox-stage"><img alt=""></div><button class="lightbox-nav" data-step="-1" aria-label="Previous screenshot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button><button class="lightbox-nav" data-step="1" aria-label="Next screenshot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button><p class="lightbox-caption"></p><div class="lightbox-thumbs"></div></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
